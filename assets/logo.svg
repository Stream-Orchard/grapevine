<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs>
  <linearGradient id="bgg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#121a15"/><stop offset="1" stop-color="#060908"/></linearGradient>
  <radialGradient id="glow" cx=".5" cy=".46" r=".6"><stop offset="0" stop-color="#3dff8a" stop-opacity=".22"/><stop offset="1" stop-color="#3dff8a" stop-opacity="0"/></radialGradient>
