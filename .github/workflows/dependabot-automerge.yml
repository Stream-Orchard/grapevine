name: Dependabot auto-merge

# Dependabot's pull requests merge themselves once the required checks pass: patch and minor
# updates, and new major versions of GitHub Actions. Other majors wait for a person.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: Auto-merge
    # Only Dependabot's own pull requests in this repository (not a fork), and only while Dependabot
    # is the one pushing to them.
    if: github.repository == 'StreamOrchard/grapevine' && github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: meta
        # Pinned to a commit: this job can write to the repository. Dependabot keeps it current.
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge once the checks pass
        if: steps.meta.outputs.package-ecosystem == 'github_actions' || steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
