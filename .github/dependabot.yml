# Pull requests for dependency updates: the dev dependencies (linting, formatting, type checks) and the
# GitHub Actions the workflows use. Weekly, a few at a time.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # All in one pull request: each edits the workflow files, and once one has merged the next can't
    # merge itself (the workflow token may not write workflows), so they'd wait for a person.
    groups:
      github-actions:
        patterns: ['*']
